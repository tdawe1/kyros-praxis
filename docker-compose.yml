version: '3.8'

# SECURITY: All secrets must be provided via .env file
# Copy .env.example to .env and set secure values before running

services:
  kyros-praxis-postgres:
    image: postgres:15
    container_name: kyros-praxis-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kyros}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kyros-praxis-redis:
    image: redis:7-alpine
    container_name: kyros-praxis-redis
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kyros-praxis-console:
    build: ./kyros-praxis/services/console
    container_name: kyros-praxis-console
    ports:
      - "${CONSOLE_PORT:-3001}:3000"
    volumes:
      - ./kyros-praxis/services/console/.env:/app/.env:ro
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@kyros-praxis-postgres:5432/${POSTGRES_DB:-kyros}
      - REDIS_URL=redis://kyros-praxis-redis:6379
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3001}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      - API_URL=http://kyros-praxis-orchestrator:8000
    depends_on:
      kyros-praxis-postgres:
        condition: service_healthy
      kyros-praxis-redis:
        condition: service_healthy
      kyros-praxis-orchestrator:
        condition: service_started

  kyros-praxis-orchestrator:
    build: ./kyros-praxis/services/orchestrator
    container_name: kyros-praxis-orchestrator
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    volumes:
      - ./kyros-praxis/services/orchestrator/.env:/app/.env:ro
    environment:
      - DB_HOST=kyros-praxis-postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-kyros}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=kyros-praxis-redis
      - REDIS_PORT=6379
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required - generate with: openssl rand -hex 32}
    depends_on:
      kyros-praxis-postgres:
        condition: service_healthy
      kyros-praxis-redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  kyros-praxis-service-registry:
    build: ./kyros-praxis/packages/service-registry
    container_name: kyros-praxis-service-registry
    ports:
      - "${SERVICE_REGISTRY_PORT:-9000}:9000"
    volumes:
      - ./kyros-praxis/packages/service-registry/.env:/app/.env:ro
    environment:
      - DB_HOST=kyros-praxis-postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-kyros}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      kyros-praxis-postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 9000

volumes:
  postgres_data:
  redis_data:
