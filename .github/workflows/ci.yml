name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Backend tests
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kyros
          POSTGRES_PASSWORD: kyros
          POSTGRES_DB: kyros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
      
      - name: Run database migrations
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://kyros:kyros@localhost:5432/kyros_test
        run: |
          alembic upgrade head
      
      - name: Run tests with coverage
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://kyros:kyros@localhost:5432/kyros_test
          JWT_SECRET_KEY: test-secret-key-min-32-chars-for-testing-only
          KYROS_ENV: test
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term -v
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/api/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # Security scanning
  security-backend:
    name: Security Scan (Backend)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit pip-audit
      
      - name: Run Safety check
        working-directory: ./apps/api
        run: |
          safety check -r requirements.txt --json || true
      
      - name: Run Bandit security linter
        working-directory: ./apps/api
        run: |
          bandit -r app/ -ll -f json -o bandit-report.json || true
      
      - name: Run pip-audit
        working-directory: ./apps/api
        run: |
          pip-audit -r requirements.txt --format json || true
  
  # Code quality
  lint-backend:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy
      
      - name: Run flake8
        working-directory: ./apps/api
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --max-complexity=10 --max-line-length=120 --statistics || true
      
      - name: Check formatting with black
        working-directory: ./apps/api
        run: |
          black --check app/ || true
      
      - name: Check import sorting
        working-directory: ./apps/api
        run: |
          isort --check-only app/ || true
  
  # Frontend tests
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./apps/console/package-lock.json
      
      - name: Install dependencies
        working-directory: ./apps/console
        run: npm ci
      
      - name: Run linter
        working-directory: ./apps/console
        run: npm run lint || true
      
      - name: Run tests
        working-directory: ./apps/console
        run: npm test || true
      
      - name: Build
        working-directory: ./apps/console
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
  
  # Security scan for frontend
  security-frontend:
    name: Security Scan (Frontend)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: ./apps/console
        run: npm ci
      
      - name: Run npm audit
        working-directory: ./apps/console
        run: npm audit --audit-level=moderate || true
  
  # Build and validate
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: false
          tags: kyros-praxis-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Console image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/console
          push: false
          tags: kyros-praxis-console:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
